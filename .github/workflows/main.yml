name: Generate Snake

on:
  schedule:
    # Runs every week (Sunday at midnight UTC)
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write   # allow writing with token

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout repo with your custom token (README_GITHUB secret)
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.README_GITHUB }}

      # Generate the snake
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: fauzan00
          outputs: |
            dist/github-contribution-grid-snake.gif
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Push new files to output branch
      - name: Push new files to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Update snake animations"
        env:
          GITHUB_TOKEN: ${{ secrets.README_GITHUB }}
