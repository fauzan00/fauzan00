<!DOCTYPE html>
<html>
<head>
  <title>GitHub README Animation Demo</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f5f5f5;
      font-family: Arial, sans-serif;
    }
    .box {
      width: 100px;
      height: 100px;
      background: #6e48aa;
      border-radius: 10px;
      animation: pulse 2s infinite, rotate 4s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }
    @keyframes rotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="box"></div>
  <script>
    // Interactive element (won't work in GitHub README, but works on GitHub Pages)
    const box = document.querySelector('.box');
    box.addEventListener('click', () => {
      box.style.background = `hsl(${Math.random() * 360}, 70%, 60%)`;
    });
  </script>
</body>
</html>
